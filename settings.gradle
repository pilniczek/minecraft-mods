pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}

	plugins {
		id 'net.fabricmc.fabric-loom' version "${loom_version}"
		id 'com.modrinth.minotaur' version "${minotaur_version}"
	}
}

rootProject.name = 'minecraft-mods'

include 'custom_blocks'
